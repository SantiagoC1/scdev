[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  # Variables que el bundle del cliente embebe a propósito (la URL del Apps Script es pública) o que no son secretas
  # (ids de modelo, topes, id de cuenta). Las claves y tokens NO van en esta lista.
  SECRETS_SCAN_OMIT_KEYS = "APPS_SCRIPT_URL,VITE_APPS_SCRIPT_URL,GROQ_MODEL,GEMINI_MODEL,CLOUDFLARE_MODEL,GROQ_REASONING_EFFORT,GEMINI_REASONING_EFFORT,PUNTO_TOPE_DIARIO,CLOUDFLARE_ACCOUNT_ID"

[functions]
  directory = "netlify/functions"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Rutas desconocidas: página 404 real (prerenderizada, noindex). Todas las rutas válidas existen como archivo,
# así que no hace falta ningún rewrite a index.html.
[[redirects]]
  from = "/*"
  to = "/404.html"
  status = 404
